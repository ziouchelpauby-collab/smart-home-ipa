name: Build Unsigned iOS IPA
on:
  workflow_dispatch:

env:
  APPLE_TEAM_ID: '0000000000'
  BUNDLE_ID: 'com.zak5978.smarthome'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env.local
        run: |
          echo "APPLE_TEAM_ID=0000000000" > .env.local
          echo "BUNDLE_ID=com.zak5978.smarthome" >> .env.local

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Safely disable Apple extensions in app.config.js
        run: |
          mv app.config.js app.config.orig.js
          cat << 'EOF' > app.config.js
          const orig = require('./app.config.orig.js');
          module.exports = (ctx) => {
            const res = typeof orig === 'function' ? orig(ctx) : orig;
            const cfg = res.expo ? res.expo : res;
            if (Array.isArray(cfg.plugins)) {
              cfg.plugins = cfg.plugins.filter(p => {
                const name = Array.isArray(p) ? p : p;
                return name !== '@bacons/apple-targets';
              });
            }
            return res;
          };
          EOF

      - name: Prebuild iOS native project
        run: npx expo prebuild --platform ios --clean

      - name: Force iOS 16.4 deployment target
        run: |
          sed -i '' "s/platform :ios, .*/platform :ios, '16.4'/g" ios/Podfile
          cd ios && pod install

      - name: Build Unsigned IPA (ARM64 iphoneos)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" IPHONEOS_DEPLOYMENT_TARGET=16.4
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r ../../SmartHome-ARM64.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-ARM64-IPA
          path: SmartHome-ARM64.ipa
